# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "2235978ef56dbb720721a7988a9a2cde"
name = "Fitment Manager"
application_url = "https://fitment-manager-git-cursor-ocean-c-5196b0-farhat-autos-projects.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_metaobjects,read_products,write_products,write_app_proxy"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://fitment-manager-git-cursor-ocean-c-5196b0-farhat-autos-projects.vercel.app/auth/callback",
  "https://fitment-manager-git-cursor-ocean-c-5196b0-farhat-autos-projects.vercel.app/auth/shopify/callback",
  "https://fitment-manager.vercel.app/auth/callback",
  "https://fitment-manager.vercel.app/auth/shopify/callback"
]

[app_proxy]
url = "/api/fitment"
prefix = "apps"
subpath = "ocean-catalogue"

[product.metafields.ocean.fitment_count]
type = "number_integer"
name = "Fitment"
description = "Count of explicit catalogue vehicle links. Sync/status only — not compatibility authority."

[product.metafields.ocean.fitment_status]
type = "single_line_text_field"
name = "Fitment status"
description = "Human label such as Fitment: N vehicles. Sync only. Do not store vehicle lists here."

[product.metafields.ocean.zero_fitment]
type = "boolean"
name = "Zero fitment"
description = "True when this Shopify product has no explicit Ocean product_fitment rows. Sync only."
